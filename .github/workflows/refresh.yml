name: Refresh Real Academy (3h)

on:
  schedule:
    - cron: '19 */3 * * *'   # reserva: o disparo principal e o cron-job.org (30 em 30 min)
  workflow_dispatch:          # gatilho confiavel = cron-job.org faz POST aqui

permissions:
  contents: write

concurrency:
  group: realacad-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build data.js (queries x leads x comercial - captacao Meta)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1 -Mode all
      - name: Commit data.js se mudou (a prova de corrida)
        shell: powershell
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if (-not (git status --porcelain data.js)) { Write-Host "sem mudancas"; exit 0 }
          $ok = $false
          for ($i=0; $i -lt 5; $i++) {
            git fetch origin main
            git reset --soft origin/main
            git add data.js
            if (-not (git status --porcelain data.js)) { Write-Host "data.js igual ao origin, nada a publicar"; $ok=$true; break }
            git commit -m ("auto: cloud " + (Get-Date -Format 'yyyy-MM-dd HH:mm'))
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { $ok=$true; break }
            Write-Host ("push rejeitado, retry " + ($i+1) + "...")
            Start-Sleep -Seconds 3
          }
          if (-not $ok) { throw "push falhou apos 5 tentativas" }
